<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R2 Concept ID — Livery, Logo, Lettering & Decal</title>
<meta name="description" content="Studio desain livery truk & kendaraan, logo, custom lettering, dan decal. Pesan langsung via WhatsApp.">
<meta property="og:title" content="R2 Concept ID">
<meta property="og:description" content="Katalog desain livery, logo, lettering & decal. Pesan via WhatsApp.">
<style>
:root{--c1:#000;--c2:#1a1a1a;--c3:#ccff66;--c4:#111;--c5:#fefefe;--c6:#339966;--c7:#33cc66;--c8:#475923;--mut:#a4a4a4;--err:#ff5c5c;--warn:#ffd166;
--glass:rgba(26,26,26,.65);--bd:rgba(204,255,102,.18);--r:18px;--blur:10px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--c4);color:var(--c5);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:"Space Grotesk",Sora,system-ui,sans-serif;line-height:1.15;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--c3)}
:focus-visible{outline:2px solid var(--c3);outline-offset:2px}
.orb{position:fixed;border-radius:9999px;filter:blur(80px);pointer-events:none;z-index:-1;animation:drift 34s ease-in-out infinite alternate}
.o1{width:260px;height:260px;background:rgba(204,255,102,.22);top:-60px;right:-60px}
.o2{width:300px;height:300px;background:rgba(51,153,102,.35);bottom:-80px;left:-80px;animation-delay:-12s}
#particles{position:fixed;inset:0;pointer-events:none;z-index:0;width:100%;height:100%}
@keyframes drift{to{transform:translate(40px,60px)}}
@media(prefers-reduced-motion:reduce){.orb{animation:none}html{scroll-behavior:auto}}
.glass{background:rgba(26,26,26,.92);border:1px solid var(--bd);border-radius:var(--r)}
@supports(backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){.glass{background:var(--glass);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 16px}
/* nav */
nav{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:rgba(17,17,17,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
nav .wrap{display:flex;align-items:center;gap:8px;height:56px}
.logo{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:1.05rem;margin-right:auto;text-decoration:none;color:var(--c5)}
.logo b{color:var(--c3)}
.tab{background:none;border:0;padding:8px 12px;border-radius:999px;cursor:pointer;color:var(--mut);font-weight:600;font-size:.9rem;text-decoration:none}
.tab[aria-current=page]{background:var(--c8);color:var(--c3)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--c3);color:#000;font-size:.72rem;font-weight:700;margin-left:4px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--bd);background:transparent;cursor:pointer;font-weight:600;text-decoration:none;color:var(--c5)}
.btn:hover{border-color:rgba(204,255,102,.5)}
.btn.pri{background:var(--c3);color:#000;border-color:var(--c3)}
.btn.sec{background:var(--c6);border-color:var(--c6)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.85rem}
.btn.dng{color:var(--err);border-color:rgba(255,92,92,.4)}
.btn[disabled]{opacity:.5}
/* hero */
.hero{position:relative;z-index:1;margin:12px 16px 0;border-radius:24px;overflow:hidden;min-height:78vh;display:flex;align-items:flex-end;background:linear-gradient(135deg,#000 0%,#0e2c1c 55%,#339966 130%);max-width:1168px}
@media(min-width:1232px){.hero{margin:12px auto 0}}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .stripe{position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(204,255,102,.07) 46px 50px)}
.hero .glass{position:relative;margin:12px;padding:22px;width:calc(100% - 24px)}
.hero h1{font-size:clamp(1.9rem,8vw,3.4rem);margin-bottom:10px}
.hero p{color:#d5d5d5;max-width:46ch;margin-bottom:18px}
.cta{display:flex;flex-direction:column;gap:10px}
@media(min-width:560px){.cta{flex-direction:row}.hero .glass{max-width:620px;margin:28px}}
/* toolbar */
section{padding:36px 0}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-h h2{font-size:1.6rem}
.tools{display:grid;gap:10px;margin-bottom:16px}
.field{width:100%;min-height:44px;padding:0 14px;border-radius:12px;background:rgba(10,10,10,.7);border:1px solid var(--bd)}
textarea.field{padding:10px 14px;min-height:80px}
select.field{padding-right:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--bd);background:transparent;cursor:pointer;color:var(--mut);font-weight:600;font-size:.88rem}
.chip[aria-pressed=true]{background:var(--c3);color:#000;border-color:var(--c3)}
@media(min-width:720px){.tools{grid-template-columns:1fr 220px}.chips{grid-column:1/-1}}
/* grid */
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1180px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{display:flex;flex-direction:column;overflow:hidden;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-2px);border-color:rgba(204,255,102,.35)}
.thumb{position:relative;aspect-ratio:16/10;display:flex;align-items:flex-end;padding:12px;overflow:hidden}
.thumb::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.07) 22px 26px)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .code{position:relative;font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:1.35rem;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.h0{background:linear-gradient(135deg,#0e2c1c,#339966)}.h1{background:linear-gradient(135deg,#222c0f,#97c800)}.h2{background:linear-gradient(135deg,#000,#33cc66)}.h3{background:linear-gradient(135deg,#1a1a1a,#476100)}
.fav{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:rgba(0,0,0,.55);cursor:pointer;font-size:1.2rem;color:var(--c5)}
.fav[aria-pressed=true]{color:var(--err);border-color:var(--err)}
.star{position:absolute;top:10px;left:10px;background:var(--c8);color:var(--c3);font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:99px}
.body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h3{font-size:1.02rem}
.cat{color:var(--mut);font-size:.85rem}
.price{font-weight:700;color:var(--c3)}
.slot{font-size:.82rem;font-weight:600}
.s-ok{color:var(--c7)}.s-low{color:var(--c3)}.s-no{color:var(--err)}
.acts{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.acts .btn{flex:1}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;color:var(--mut)}
.empty h3{color:var(--c5);margin-bottom:6px}
/* modal */
dialog{border:1px solid var(--bd);border-radius:20px;background:#141414;color:var(--c5);padding:0;width:min(560px,calc(100% - 24px));max-height:92vh;overflow:auto;margin:auto}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog .in{padding:18px;display:grid;gap:12px}
dialog .thumb{border-radius:14px;aspect-ratio:16/9}
.row{display:flex;gap:8px;flex-wrap:wrap}
label{display:grid;gap:4px;font-size:.88rem;color:var(--mut)}
.err{color:var(--err);font-size:.8rem;min-height:0}
@media(max-width:559px){dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:20px 20px 0 0}}
/* dashboard */
.stats{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin-bottom:16px}
@media(min-width:720px){.stats{grid-template-columns:repeat(5,1fr)}}
.stat{padding:14px}.stat b{display:block;font-family:"Space Grotesk",system-ui,sans-serif;font-size:1.5rem;color:var(--c3)}.stat span{font-size:.8rem;color:var(--mut)}
.note{padding:12px 14px;border-radius:12px;border:1px dashed var(--bd);color:var(--mut);font-size:.85rem;margin-bottom:16px}
.list{display:grid;gap:10px}
.item{padding:12px 14px;display:grid;gap:8px}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:start}
.item small{color:var(--mut)}
@media(min-width:720px){.list.two{grid-template-columns:repeat(2,1fr)}}
.st{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.st-Antre{color:var(--mut)}.st-Proses{color:var(--c3)}.st-Revisi{color:var(--warn)}.st-Selesai{color:var(--c7)}
.bar{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;font-size:.82rem;margin:6px 0}
.bar i{display:block;height:8px;border-radius:9px;background:linear-gradient(90deg,var(--c6),var(--c3))}
.seg{display:flex;gap:6px;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;background:var(--c3);color:#000;padding:10px 18px;border-radius:99px;font-weight:600;font-size:.9rem;max-width:90%}
footer{position:relative;z-index:1;padding:28px 16px 40px;text-align:center;color:var(--mut);font-size:.85rem;border-top:1px solid var(--bd)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="orb o1" aria-hidden="true"></div><div class="orb o2" aria-hidden="true"></div>
<canvas id="particles" aria-hidden="true"></canvas>

<nav><div class="wrap">
  <a class="logo" href="#/">R2 <b>Concept</b> ID</a>
  <a class="tab" id="tKat" href="#/" aria-current="page">Katalog</a>
  <a class="tab" id="tDash" href="#/dashboard">Dashboard</a>
  <button class="tab" id="tFav" aria-label="Lihat favorit">♥<span class="badge" id="favN">0</span></button>
</div></nav>

<main id="app"></main>

<footer>© R2 Concept ID · Livery, Logo, Lettering &amp; Decal · Data tersimpan di perangkat ini.</footer>
<dialog id="dlg" aria-label="Dialog"></dialog>

<script>
(()=>{
const WA_DEFAULT="6288228549752",CATS=["Desain Livery","Desain Logo","Lettering & Stiker","Decal & Apparel"],STAT=["Antre","Proses","Revisi","Selesai"];
const D_DESC="File master: CDR (vektor) + AI + PNG preview resolusi tinggi. Termasuk 2x revisi minor; revisi tambahan dikenakan biaya.";
const seed=[
["p1","R2-LVR-01","Livery Truk Trailer Full Wrap",0,1500000,3,1],["p2","R2-LVR-02","Livery Pickup & Box Armada",0,750000,5,0],
["p3","R2-LVR-03","Livery Mobil Komunitas",0,0,2,0],["p4","R2-LGO-01","Logo Brand UMKM (Paket Basic)",1,350000,6,1],
["p5","R2-LGO-02","Logo Perusahaan Transportasi",1,800000,0,0],["p6","R2-LTR-01","Custom Lettering Nama & Nomor Armada",2,150000,10,0],
["p7","R2-LTR-02","Paket Stiker Cutting Branding",2,275000,4,1],["p8","R2-DCL-01","Decal Apparel & Merchandise",3,200000,7,0]
].map((a,i)=>({id:a[0],code:a[1],nama:a[2],kategori:CATS[a[3]],harga:a[4],slot:a[5],unggulan:!!a[6],deskripsi:D_DESC,imageUrl:"",createdAt:i+1}));
/* storage aman */
let mem={};
const ld=(k,def)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return mem[k]??def}};
const sv=(k,v)=>{mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let products=ld("r2_products",seed),favs=ld("r2_favorites",[]),recap=ld("r2_monthly_recap",[]);
favs=favs.filter(id=>products.some(p=>p.id===id));
const ui={q:"",cat:"Semua",sort:"terbaru",onlyFav:false};
/* util */
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);
const harga=p=>p.harga>0?rp(p.harga):"Harga Custom / Konsultasi";
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const okImg=u=>!u||/^(\/|https:\/\/)/.test(u)&&!/^data:image\/svg/i.test(u);
const toast=t=>{const e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2400)};
const waUrl=m=>"https://wa.me/"+(ld("r2_settings",{}).waNumber||WA_DEFAULT)+"?text="+encodeURIComponent(m);
const openWA=m=>window.open(waUrl(m),"_blank","noopener,noreferrer");
const msgOne=p=>p.slot===0?`Hai R2 Concept, saya minat dengan product ${p.kategori} (${p.code} - ${p.nama}).\nSaya lihat antrean sedang penuh, bisa masuk waitlist? Terima kasih!`
:`Hai R2 Concept, saya minat dengan product ${p.kategori} (${p.code} - ${p.nama}).\nEstimasi harga: ${p.harga>0?rp(p.harga):"Harga Custom"}.\nMohon info ketersediaan slot dan prosesnya. Terima kasih!`;
function msgFav(){const L=products.filter(p=>favs.includes(p.id));const head="Hai R2 Concept, berikut daftar desain favorit saya:\n",tail="\nMohon info lebih lanjut dan estimasi pengerjaannya. Terima kasih!";
let body="";L.forEach((p,i)=>{const l=`${i+1}. ${p.code} - ${p.nama} (${p.kategori}) - ${p.harga>0?rp(p.harga):"Harga Custom"}\n`;if((head+body+l+tail).length>1500){body+=`…dan ${L.length-i} desain lainnya\n`;L.length=i;return}body+=l});return head+body+tail}
const slotTxt=p=>p.slot>3?[`Slot tersedia: ${p.slot}`,"s-ok"]:p.slot>0?[`Sisa ${p.slot} slot`,"s-low"]:["Antrean penuh","s-no"];
const hue=p=>"h"+Math.max(0,CATS.indexOf(p.kategori));
const thumb=(p,extra="")=>`<div class="thumb ${hue(p)}">${p.imageUrl&&okImg(p.imageUrl)?`<img src="${esc(p.imageUrl)}" alt="${esc(p.nama)}" loading="lazy" decoding="async" onerror="this.remove()">`:""}<span class="code">${esc(p.code)}</span>${extra}</div>`;

/* katalog */
function filtered(){
 let L=products.filter(p=>(ui.cat==="Semua"||p.kategori===ui.cat)&&(!ui.onlyFav||favs.includes(p.id))&&(p.nama+" "+p.code).toLowerCase().includes(ui.q.toLowerCase()));
 const lastZero=(a,b,dir)=>a.harga===0?1:b.harga===0?-1:dir*(a.harga-b.harga);
 const s=ui.sort;
 return L.sort((a,b)=>s==="murah"?lastZero(a,b,1):s==="mahal"?lastZero(a,b,-1):s==="unggulan"?(b.unggulan-a.unggulan)||b.createdAt-a.createdAt:b.createdAt-a.createdAt);
}
function cardHTML(p){const[t,c]=slotTxt(p),f=favs.includes(p.id);
 return `<article class="card glass">${thumb(p,`${p.unggulan?'<span class="star">Unggulan</span>':""}<button class="fav" data-fav="${p.id}" aria-pressed="${f}" aria-label="Favorit ${esc(p.nama)}">${f?"♥":"♡"}</button>`)}
 <div class="body"><h3>${esc(p.nama)}</h3><span class="cat">${esc(p.kategori)}</span><span class="price">${harga(p)}</span><span class="slot ${c}">${t}</span>
 <div class="acts"><button class="btn sm" data-det="${p.id}">Detail</button><button class="btn sm pri" data-wa="${p.id}">${p.slot?"Pesan":"Tanya Waitlist"}</button></div></div></article>`}
function drawGrid(){const L=filtered();$("#grid").innerHTML=L.length?L.map(cardHTML).join(""):
 `<div class="empty"><h3>Belum ada desain yang cocok</h3><p>Coba kata kunci lain atau hapus filter.</p><br><button class="btn" id="rst">Reset filter</button></div>`;
 $("#favN").textContent=favs.length;const fb=$("#favBtn");if(fb){fb.textContent=`Favorit Saya (${favs.length})`;fb.setAttribute("aria-pressed",ui.onlyFav)}
 $("#favWA")?.classList.toggle("hide",!(ui.onlyFav&&favs.length))}
function viewHome(){const s=ld("r2_settings",{});
 $("#app").innerHTML=`<header class="hero"><div class="stripe"></div>${s.bannerUrl&&okImg(s.bannerUrl)?`<img src="${esc(s.bannerUrl)}" alt="" onerror="this.remove()">`:`<img src="assets/img/banner.jpg" alt="" onerror="this.remove()">`}
 <div class="glass"><h1>${esc(s.heroHeadline||"Livery, logo, dan lettering yang bikin armada Anda dikenal.")}</h1>
 <p>${esc(s.heroSubheadline||"Studio desain R2 Concept ID: livery truk & kendaraan, logo, custom lettering, dan decal. Konsultasi dulu, slot terbatas.")}</p>
 <div class="cta"><a class="btn pri" href="#katalog" id="goKat">Lihat Katalog</a><button class="btn sec" id="heroWA">Chat WhatsApp</button></div></div></header>
 <section id="katalog"><div class="wrap">
 <div class="sec-h"><h2>Katalog desain</h2><button class="chip" id="favBtn" aria-pressed="false">Favorit Saya (0)</button></div>
 <div class="tools"><input class="field" id="q" type="search" placeholder="Cari nama atau kode desain" aria-label="Cari desain" value="${esc(ui.q)}">
 <select class="field" id="sort" aria-label="Urutkan"><option value="terbaru">Terbaru</option><option value="unggulan">Unggulan</option><option value="murah">Harga terendah</option><option value="mahal">Harga tertinggi</option></select>
 <div class="chips" role="group" aria-label="Kategori">${["Semua",...CATS].map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${ui.cat===c}">${esc(c)}</button>`).join("")}</div></div>
 <button class="btn pri hide" id="favWA" style="margin-bottom:14px">Kirim Favorit via WhatsApp</button>
 <div class="grid" id="grid"></div></div></section>`;
 $("#sort").value=ui.sort;drawGrid()}
function detail(id){const p=products.find(x=>x.id===id);if(!p)return;const[t,c]=slotTxt(p),f=favs.includes(id),d=$("#dlg");
 d.innerHTML=`<div class="in">${thumb(p)}<div><span class="cat">${esc(p.kategori)}</span><h3 style="font-size:1.3rem">${esc(p.nama)}</h3></div>
 <span class="price">${harga(p)}</span><span class="slot ${c}">${t}</span><p style="color:#d5d5d5">${esc(p.deskripsi)}</p>
 <div class="row"><button class="btn" data-fav="${id}" aria-pressed="${f}">${f?"♥ Tersimpan":"♡ Simpan favorit"}</button><button class="btn pri" data-wa="${id}">${p.slot?"Pesan via WhatsApp":"Tanya Waitlist"}</button><button class="btn" data-close>Tutup</button></div></div>`;d.showModal()}

/* dashboard (tanpa login: lihat catatan) */
let tab="produk",bulan=new Date().toISOString().slice(0,7);
function viewDash(){
 const sisa=products.reduce((a,p)=>a+p.slot,0),pen=products.filter(p=>!p.slot).length,kat=new Set(products.map(p=>p.kategori)).size;
 $("#app").innerHTML=`<section><div class="wrap"><h2 style="margin-bottom:12px">Dashboard</h2>
 <p class="note">Data tersimpan di perangkat ini saja. Lakukan ekspor berkala sebagai cadangan.</p>
 <div class="stats">${[[products.length,"Total karya"],[kat,"Kategori terisi"],[products.filter(p=>p.unggulan).length,"Unggulan"],[sisa,"Slot tersisa"],[pen,"Slot habis"]].map(s=>`<div class="stat glass"><b>${s[0]}</b><span>${s[1]}</span></div>`).join("")}</div>
 <div class="seg"><button class="chip" data-tab="produk" aria-pressed="${tab==="produk"}">Produk</button><button class="chip" data-tab="rekap" aria-pressed="${tab==="rekap"}">Rekap bulanan</button><button class="chip" data-tab="set" aria-pressed="${tab==="set"}">Pengaturan</button></div>
 <div id="dBody"></div></div></section>`;({produk:dProduk,rekap:dRekap,set:dSet})[tab]()}
function dProduk(){$("#dBody").innerHTML=`<button class="btn pri" id="addP" style="margin-bottom:14px">Tambah produk</button><div class="list two">${products.map(p=>`<div class="item glass"><div class="top"><div><b>${esc(p.nama)}</b><br><small>${esc(p.code)} · ${esc(p.kategori)} · ${harga(p)} · slot ${p.slot}</small></div>${p.unggulan?'<span class="st st-Proses">Unggulan</span>':""}</div>
 <div class="row"><button class="btn sm" data-edit="${p.id}">Edit</button><button class="btn sm" data-star="${p.id}">${p.unggulan?"Lepas unggulan":"Jadikan unggulan"}</button><button class="btn sm dng" data-del="${p.id}">Hapus</button></div></div>`).join("")}</div>`}
function dRekap(){const L=recap.filter(o=>o.bulan===bulan).sort((a,b)=>b.tanggal.localeCompare(a.tanggal)),tot=L.reduce((a,o)=>a+o.nominal,0),avg=L.length?Math.round(tot/L.length):0,sel=L.filter(o=>o.status==="Selesai");
 const per=CATS.map(c=>[c,L.filter(o=>o.kategori===c).length]),mx=Math.max(1,...per.map(x=>x[1]));
 $("#dBody").innerHTML=`<div class="row" style="margin-bottom:14px"><input class="field" type="month" id="bln" value="${bulan}" aria-label="Bulan" style="width:auto"><button class="btn pri" id="addO">Tambah order</button></div>
 <div class="stats">${[[L.length,"Total order"],[rp(tot),"Omzet masuk"],[rp(avg),"Rata-rata proyek"],[sel.length,"Order selesai"],[rp(sel.reduce((a,o)=>a+o.nominal,0)),"Omzet selesai"]].map(s=>`<div class="stat glass"><b style="font-size:1.15rem">${s[0]}</b><span>${s[1]}</span></div>`).join("")}</div>
 <div class="glass item" style="margin-bottom:12px"><b>Order per kategori</b>${per.map(x=>`<div class="bar"><span>${esc(x[0])}</span><span><i style="width:${x[1]/mx*100}%"></i></span><b>${x[1]}</b></div>`).join("")}<small>${STAT.map(s=>`${s}: ${L.filter(o=>o.status===s).length}`).join(" · ")}</small></div>
 <div class="list two">${L.length?L.map(o=>`<div class="item glass"><div class="top"><div><b>${esc(o.namaKlien)}</b><br><small>${esc(o.tanggal)} · ${esc(o.produkNama)}</small></div><span class="st st-${o.status}">${o.status}</span></div><div class="price">${rp(o.nominal)}</div>${o.catatan?`<small>${esc(o.catatan)}</small>`:""}<div class="row"><button class="btn sm dng" data-delo="${o.id}">Hapus</button></div></div>`).join(""):'<p class="empty">Belum ada order di bulan ini.</p>'}</div>`}
function dSet(){const s=ld("r2_settings",{});$("#dBody").innerHTML=`<div class="glass item"><label>Nomor WhatsApp tujuan<input class="field" id="waN" inputmode="tel" value="${esc(s.waNumber||WA_DEFAULT)}"></label><p class="err" id="waE"></p>
 <small>Perubahan hanya berlaku di perangkat ini.</small><div class="row"><button class="btn pri" id="saveWA">Simpan nomor</button><button class="btn" id="testWA">Tes buka WhatsApp</button></div></div>
 <div class="glass item" style="margin-top:12px"><b>Reset data</b><small>Memulihkan katalog, favorit, rekap, dan pengaturan ke bawaan.</small><div><button class="btn dng" id="reset">Reset ke data default</button></div></div>`}
const normWA=v=>{let n=String(v).replace(/[\s\-()]/g,"").replace(/^\+/,"");if(n.startsWith("0"))n="62"+n.slice(1);return/^62\d{8,13}$/.test(n)?n:null};

/* form dialog */
function formP(id){const p=products.find(x=>x.id===id)||{code:"",nama:"",kategori:CATS[0],harga:0,slot:0,deskripsi:"",imageUrl:"",unggulan:false},d=$("#dlg");
 d.innerHTML=`<div class="in"><h3>${id?"Edit":"Tambah"} produk</h3><div id="fe"></div>
 <label>Kode<input class="field" id="fc" value="${esc(p.code)}" placeholder="R2-XXX-01"></label><label>Nama<input class="field" id="fn" maxlength="80" value="${esc(p.nama)}"></label>
 <label>Kategori<select class="field" id="fk">${CATS.map(c=>`<option ${c===p.kategori?"selected":""}>${esc(c)}</option>`).join("")}</select></label>
 <div class="row"><label style="flex:1">Harga (0 = custom)<input class="field" id="fh" type="number" min="0" inputmode="numeric" value="${p.harga}"></label><label style="flex:1">Slot<input class="field" id="fs" type="number" min="0" inputmode="numeric" value="${p.slot}"></label></div>
 <label>Deskripsi<textarea class="field" id="fd">${esc(p.deskripsi)}</textarea></label><label>URL gambar (opsional)<input class="field" id="fi" value="${esc(p.imageUrl)}"></label>
 <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="fu" ${p.unggulan?"checked":""}> Tandai unggulan</label>
 <div class="row"><button class="btn pri" id="fsave">Simpan</button><button class="btn" data-close>Batal</button></div></div>`;d.showModal();
 $("#fsave").onclick=()=>{const v={code:$("#fc").value.trim(),nama:$("#fn").value.trim(),kategori:$("#fk").value,harga:+$("#fh").value,slot:+$("#fs").value,deskripsi:$("#fd").value.trim(),imageUrl:$("#fi").value.trim(),unggulan:$("#fu").checked};
  const e=!v.code?"Kode wajib diisi.":products.some(x=>x.id!==id&&x.code.toLowerCase()===v.code.toLowerCase())?"Kode sudah dipakai.":!v.nama?"Nama wajib diisi.":!Number.isInteger(v.harga)||v.harga<0?"Harga harus bilangan bulat ≥ 0.":!Number.isInteger(v.slot)||v.slot<0?"Slot harus bilangan bulat ≥ 0.":!okImg(v.imageUrl)?"URL gambar harus diawali / atau https://.":"";
  if(e){$("#fe").innerHTML=`<p class="err" role="alert">${e}</p>`;return}
  if(id)Object.assign(products.find(x=>x.id===id),v);else products.push({id:uid(),createdAt:Date.now(),...v});
  sv("r2_products",products);d.close();toast("Produk disimpan");route()}}
function formO(){const d=$("#dlg");d.innerHTML=`<div class="in"><h3>Tambah order</h3><div id="fe"></div>
 <label>Tanggal<input class="field" type="date" id="ot" value="${new Date().toISOString().slice(0,10)}"></label><label>Nama klien<input class="field" id="on"></label><label>Produk<input class="field" id="op"></label>
 <label>Kategori<select class="field" id="ok">${CATS.map(c=>`<option>${esc(c)}</option>`).join("")}</select></label><label>Nominal masuk (Rp)<input class="field" type="number" min="0" id="om" inputmode="numeric"></label>
 <label>Status<select class="field" id="os">${STAT.map(s=>`<option>${s}</option>`).join("")}</select></label><label>Catatan<input class="field" id="oc"></label>
 <div class="row"><button class="btn pri" id="osave">Simpan</button><button class="btn" data-close>Batal</button></div></div>`;d.showModal();
 $("#osave").onclick=()=>{const o={id:uid(),tanggal:$("#ot").value,namaKlien:$("#on").value.trim(),produkNama:$("#op").value.trim(),kategori:$("#ok").value,nominal:+$("#om").value,status:$("#os").value,catatan:$("#oc").value.trim()};
  if(!o.tanggal||!o.namaKlien||!Number.isInteger(o.nominal)||o.nominal<0){$("#fe").innerHTML='<p class="err" role="alert">Isi tanggal, nama klien, dan nominal (bilangan bulat ≥ 0).</p>';return}
  o.bulan=o.tanggal.slice(0,7);recap.push(o);sv("r2_monthly_recap",recap);bulan=o.bulan;d.close();toast("Order disimpan");route()}}
function confirmDo(msg,fn){const d=$("#dlg");d.innerHTML=`<div class="in"><h3>Konfirmasi</h3><p>${esc(msg)}</p><div class="row"><button class="btn dng" id="yes">Ya, lanjutkan</button><button class="btn" data-close>Batal</button></div></div>`;d.showModal();$("#yes").onclick=()=>{d.close();fn()}}

/* router & events */
function route(){const dash=location.hash.startsWith("#/dashboard");$("#tKat").toggleAttribute("aria-current",!dash);$("#tDash").toggleAttribute("aria-current",dash);
 if(!dash)$("#tKat").setAttribute("aria-current","page");else $("#tDash").setAttribute("aria-current","page");
 if(dash)$("#tKat").removeAttribute("aria-current");else $("#tDash").removeAttribute("aria-current");
 dash?viewDash():viewHome();$("#favN").textContent=favs.length}
const toggleFav=id=>{favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];sv("r2_favorites",favs)};
document.addEventListener("click",e=>{const t=e.target.closest("button,a");if(!t)return;const g=a=>t.dataset[a];
 if(g("fav")){toggleFav(g("fav"));if($("#dlg").open)detail(g("fav"));drawGrid()}
 else if(g("det"))detail(g("det"));
 else if(g("wa")){openWA(msgOne(products.find(p=>p.id===g("wa"))))}
 else if(t.hasAttribute("data-close"))$("#dlg").close();
 else if(g("cat")){ui.cat=g("cat");document.querySelectorAll("[data-cat]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cat===ui.cat));drawGrid()}
 else if(t.id==="favBtn"){ui.onlyFav=!ui.onlyFav;drawGrid()}
 else if(t.id==="tFav"){if(location.hash.startsWith("#/dashboard"))location.hash="#/";ui.onlyFav=true;setTimeout(()=>{route();$("#katalog").scrollIntoView()},0)}
 else if(t.id==="favWA")openWA(msgFav());
 else if(t.id==="heroWA")openWA("Hai R2 Concept, saya ingin konsultasi desain. Boleh dibantu?");
 else if(t.id==="rst"){Object.assign(ui,{q:"",cat:"Semua",onlyFav:false});viewHome()}
 else if(g("tab")){tab=g("tab");viewDash()}
 else if(t.id==="addP")formP();else if(g("edit"))formP(g("edit"));
 else if(g("star")){const p=products.find(x=>x.id===g("star"));p.unggulan=!p.unggulan;sv("r2_products",products);viewDash()}
 else if(g("del"))confirmDo("Hapus produk ini? Rekap order tidak ikut terhapus.",()=>{const id=g("del");products=products.filter(p=>p.id!==id);favs=favs.filter(x=>x!==id);sv("r2_products",products);sv("r2_favorites",favs);viewDash();toast("Produk dihapus")});
 else if(t.id==="addO")formO();
 else if(g("delo"))confirmDo("Hapus order ini?",()=>{recap=recap.filter(o=>o.id!==g("delo"));sv("r2_monthly_recap",recap);viewDash()});
 else if(t.id==="saveWA"){const n=normWA($("#waN").value);if(!n){$("#waE").textContent="Nomor tidak valid. Gunakan 08…, +62… atau 628….";return}const s=ld("r2_settings",{});s.waNumber=n;sv("r2_settings",s);$("#waN").value=n;$("#waE").textContent="";toast("Nomor disimpan")}
 else if(t.id==="testWA"){const n=normWA($("#waN").value);n?window.open("https://wa.me/"+n,"_blank","noopener,noreferrer"):$("#waE").textContent="Nomor tidak valid."}
 else if(t.id==="reset")confirmDo("Reset semua data ke default?",()=>{["r2_products","r2_favorites","r2_monthly_recap","r2_settings"].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});products=seed.map(p=>({...p}));favs=[];recap=[];viewDash();toast("Data dipulihkan")});
 else if(t.id==="goKat"){e.preventDefault();$("#katalog").scrollIntoView()}
});
let db;document.addEventListener("input",e=>{if(e.target.id==="q"){clearTimeout(db);db=setTimeout(()=>{ui.q=e.target.value;drawGrid()},200)}});
document.addEventListener("change",e=>{if(e.target.id==="sort"){ui.sort=e.target.value;drawGrid()}if(e.target.id==="bln"&&e.target.value){bulan=e.target.value;dRekap()}});
$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")e.target.close()});
addEventListener("hashchange",route);addEventListener("storage",()=>{products=ld("r2_products",products);favs=ld("r2_favorites",favs);recap=ld("r2_monthly_recap",recap);route()});
route();

/* partikel */
const cv=$("#particles"),cx=cv.getContext("2d");let W,H,P=[],run=!matchMedia("(prefers-reduced-motion:reduce)").matches;
function size(){const r=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;cx.setTransform(r,0,0,r,0,0);
 const n=(W<768||matchMedia("(pointer:coarse)").matches)?28:70;P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*1.5,a:.2+Math.random()*.5,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,c:Math.random()<.5?"#ccff66":"#33cc66"}));draw()}
function draw(){cx.clearRect(0,0,W,H);P.forEach(p=>{if(run){p.x=(p.x+p.vx+W)%W;p.y=(p.y+p.vy+H)%H}cx.globalAlpha=p.a;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()})}
(function loop(){if(run&&!document.hidden)draw();requestAnimationFrame(loop)})();
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(size,200)});size();
})();
</script>
</body>
